name: calendar

services:
  app:
    image: calendar:local
    container_name: calendar
    restart: unless-stopped
    build:
      context: /srv/repos/calendar
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_HOSTS: calendar.home.cniebuhr.com
      DATABASE_PATH: /data/calendar.sqlite3
      FORCE_SSL: "true"
      TZ: America/New_York
    volumes:
      - /srv/compose/calendar/data:/data
      - /srv/compose/calendar/backups:/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.calendar.rule=Host(`calendar.home.cniebuhr.com`)
      - traefik.http.routers.calendar.entrypoints=websecure
      - traefik.http.routers.calendar.tls=true
      - traefik.http.services.calendar.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
